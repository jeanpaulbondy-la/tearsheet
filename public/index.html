<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tearsheet</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Tearsheet</h1>
      <p class="byline"><a href="https://jbondy.com" target="_blank" rel="noopener">Created by Jean-Paul Bondy 2026</a></p>
    </div>
    <input id="search" type="text" placeholder="Search titles, tags, categories…" autocomplete="off" />
  </header>

  <main id="grid" class="grid"></main>

  <p id="empty" class="empty" hidden>
    No images yet — drop some in <code>inbox/</code> and run <code>/process-inbox</code> in Claude Code.
  </p>

  <div id="selection-bar" class="selection-bar" hidden>
    <span id="selection-count">0 selected</span>
    <div class="selection-actions">
      <button id="clear-selection" type="button" class="btn-secondary">Clear</button>
      <button id="save-selection" type="button" class="btn-primary">Save for Claude Code</button>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
